<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mystic Grill - Calculadora de Churrasco</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Imagens laterais -->
  <img src="img/carne.png" alt="Carne" class="img-lateral img-esquerda">
  <img src="img/refri.png" alt="Refrigerante" class="img-lateral img-direita">

  <!-- Cabeçalho -->
  <header>
    <h1>────Mystic Grill────</h1>
  </header>

  <!-- Calculadora -->
  <main>
    <section>

      <h2>Calculadora de Consumo</h2>

      <div class="campo">
        <label for="adultos">👨 Adultos:</label>
        <input type="number" id="adultos" value="0" min="0">
      </div>

      <div class="campo">
        <label for="criancas">👶 Crianças:</label>
        <input type="number" id="criancas" value="0" min="0">
      </div>

      <button id="btnCalcular">Calcular Consumo</button>

      <div id="resultado"></div>

    </section>
  </main>

  <script src="script.js"></script>

</body>
</html>
